name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build renderer
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: clack-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Tag push => publish the installers onto that GitHub release.
      # An existing draft with the same tag is picked up and published.
      - name: Publish release installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Clack ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release/*.exe
